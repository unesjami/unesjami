<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">Unes Jami — AI Automation and Robotics Developer</title>
<desc id="banner-desc">Animated neural pathways, glowing signal particles and orbiting nodes surround the name Unes Jami. A modern, dark technology banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#081224"/><stop offset=".55" stop-color="#111B38"/><stop offset="1" stop-color="#071627"/>
  </linearGradient>
  <radialGradient id="aura"><stop offset="0" stop-color="#21C3EE" stop-opacity=".31"/><stop offset=".52" stop-color="#5267FF" stop-opacity=".09"/><stop offset="1" stop-color="#21C3EE" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F8FAFC"/><stop offset=".55" stop-color="#E7F8FF"/><stop offset="1" stop-color="#BCEAFB"/>
  </linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38BDF8" stop-opacity=".35"/><stop offset=".6" stop-color="#6A87FE" stop-opacity=".38"/><stop offset="1" stop-color="#2DD4BF" stop-opacity=".15"/>
  </linearGradient>
  <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="soft"/><feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#D5EEFF" stroke-width=".65" stroke-opacity=".045"/>
  </pattern>
  <clipPath id="clip"><rect width="1200" height="320" rx="21"/></clipPath>
  <g id="network">
    <g fill="none" stroke="url(#wire)" stroke-width="1.25" stroke-linecap="round">
      <path id="p1" d="M 16 56 C 66 32 92 95 136 83 S 216 40 268 82 S 310 114 358 112"/>
      <path id="p2" d="M 15 164 C 78 160 92 122 136 130 S 213 197 268 152 S 309 143 358 159"/>
      <path id="p3" d="M 16 266 C 65 292 100 240 136 238 S 207 207 268 237 S 308 200 358 202"/>
      <path d="M 16 56 C 72 110 86 140 136 130 S 216 132 268 152"/>
      <path d="M 16 164 C 69 191 93 223 136 238 S 214 264 268 237"/>
      <path d="M 136 83 C 194 100 202 181 268 237"/>
      <path d="M 136 238 C 185 220 215 86 268 82"/>
      <path d="M 136 130 C 195 114 217 97 268 82"/>
      <path d="M 268 82 C 298 91 323 136 358 159"/>
      <path d="M 268 237 C 310 215 323 180 358 159"/>
    </g>
    <g fill="#38BDF8" stroke="#07162B" stroke-width="2">
      <circle cx="16" cy="56" r="4"/><circle cx="16" cy="164" r="4.5"/><circle cx="16" cy="266" r="3.5"/>
      <circle cx="136" cy="83" r="5.5"/><circle cx="136" cy="130" r="5"/><circle cx="136" cy="238" r="5.5"/>
      <circle cx="268" cy="82" r="5"/><circle cx="268" cy="152" r="6.5"/><circle cx="268" cy="237" r="5.5"/>
      <circle cx="358" cy="112" r="4.5"/><circle cx="358" cy="159" r="8" fill="#2DD4BF" filter="url(#halo)">
        <animate attributeName="r" values="6.5;9;6.5" dur="3.6s" repeatCount="indefinite"/>
      </circle><circle cx="358" cy="202" r="4.5"/>
    </g>
    <g fill="#E5F7FF" filter="url(#halo)">
      <circle r="3.4"><animateMotion dur="5.5s" repeatCount="indefinite" path="M 16 56 C 66 32 92 95 136 83 S 216 40 268 82 S 310 114 358 112"/></circle>
      <circle r="3"><animateMotion dur="7.8s" begin="-.8s" repeatCount="indefinite" path="M 15 164 C 78 160 92 122 136 130 S 213 197 268 152 S 309 143 358 159"/></circle>
      <circle r="3.4"><animateMotion dur="7.1s" begin="-2s" repeatCount="indefinite" path="M 16 266 C 65 292 100 240 136 238 S 207 207 268 237 S 308 200 358 202"/></circle>
    </g>
    <g fill="none" stroke="#22D3EE" stroke-width="1">
      <circle cx="358" cy="159" r="13" opacity=".35">
        <animate attributeName="r" values="13;37" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".42;0" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="600" cy="162" rx="440" ry="218" fill="url(#aura)">
    <animate attributeName="opacity" values=".60;1;.60" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="130" cy="135" rx="140" ry="130" fill="url(#aura)" opacity=".5"/>
  <ellipse cx="1070" cy="135" rx="140" ry="130" fill="url(#aura)" opacity=".5"/>
  <use href="#network"/>
  <use href="#network" transform="translate(1200 0) scale(-1 1)"/>
  <rect x="419" y="55" width="362" height="210" rx="28" fill="#0C1730" opacity=".64"/>
  <rect x="419.8" y="55.8" width="360.4" height="208.4" rx="27" stroke="#5E99CC" stroke-opacity=".20" fill="none"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="100" font-size="15" font-weight="700" letter-spacing="4" fill="#75E3F2">BUILD · AUTOMATE · EVOLVE</text>
    <text x="600" y="173" font-size="59" font-weight="800" fill="url(#name)">Unes Jami</text>
    <text x="600" y="213" font-size="20" font-weight="600" fill="#5ADBF4">AI AUTOMATION &amp; ROBOTICS</text>
    <text x="600" y="242" font-size="14" fill="#BDD3EA" letter-spacing="1.1">SOFTWARE  /  CLOUD  /  COMPUTER VISION</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#A2DFFF" stroke-opacity=".18"/>
</g>
</svg>
