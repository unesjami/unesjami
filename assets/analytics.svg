<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity and project portfolio</title>
  <desc id="desc">Accurate repository growth timeline for 15 non-profile repositories as of October 16, 2026, and charts of repository primary language and project focus. Includes private projects without linking private source code. These are not GitHub contribution statistics.</desc>
  <defs>
    <linearGradient id="growth" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-35%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="350" rx="18" fill="#ffffff"/>
  <g font-family="Segoe UI,Arial,sans-serif">
