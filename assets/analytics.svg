<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Engineering focus</title>
  <desc id="desc">Three technical areas: AI and Telegram automation, web applications and cloud services, and robotics and computer vision. Illustrative categories, not fabricated GitHub activity statistics.</desc>
  <rect width="1200" height="340" rx="18" fill="#ffffff"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="600" y="49" text-anchor="middle" font-size="25" fill="#0f172a" font-weight="700">Engineering Focus</text>
    <text x="600" y="75" text-anchor="middle" font-size="14" fill="#64748b">Practical systems across software, AI, and hardware</text>
    <g transform="translate(30 105)">
      <rect width="360" height="202" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="7" height="202" rx="3.5" fill="#0ea5e9"/>
      <circle cx="46" cy="45" r="19" fill="#e0f2fe"/>
      <path d="M36 45h20M46 35v20" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
      <text x="75" y="51" font-size="19" font-weight="700" fill="#0f172a">AI &amp; Automation</text>
      <text x="29" y="94" font-size="15" fill="#475569">AI agents and API integration</text>
      <text x="29" y="124" font-size="15" fill="#475569">Telegram bots and workflows</text>
      <text x="29" y="154" font-size="15" fill="#475569">Python · FastAPI · Webhooks</text>
    </g>
    <g transform="translate(420 105)">
      <rect width="360" height="202" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="7" height="202" rx="3.5" fill="#6366f1"/>
      <circle cx="46" cy="45" r="19" fill="#eef2ff"/>
      <path d="M35 39h22v15H35zM40 59h12" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="75" y="51" font-size="19" font-weight="700" fill="#0f172a">Web &amp; Cloud</text>
      <text x="29" y="94" font-size="15" fill="#475569">Full-stack web applications</text>
      <text x="29" y="124" font-size="15" fill="#475569">Cloudflare Workers · D1 · R2</text>
      <text x="29" y="154" font-size="15" fill="#475569">React · TypeScript · APIs</text>
    </g>
    <g transform="translate(810 105)">
      <rect width="360" height="202" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="7" height="202" rx="3.5" fill="#14b8a6"/>
      <circle cx="46" cy="45" r="19" fill="#ccfbf1"/>
      <path d="M36 38l10 7-10 7M49 52h9" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="75" y="51" font-size="19" font-weight="700" fill="#0f172a">Robotics &amp; Vision</text>
      <text x="29" y="94" font-size="15" fill="#475569">Embedded hardware and sensors</text>
      <text x="29" y="124" font-size="15" fill="#475569">Gesture and Bluetooth control</text>
      <text x="29" y="154" font-size="15" fill="#475569">Arduino · ESP32 · OpenCV</text>
