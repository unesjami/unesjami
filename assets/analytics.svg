      <circle cx="345.6" cy="78.5" r="5" fill="#16a34a" stroke="#fff" stroke-width="2"/>
      <text x="17" y="248" fill="#64748b" font-size="11">Oct '25</text><text x="113" y="248" fill="#64748b" font-size="11">Feb</text><text x="218" y="248" fill="#64748b" font-size="11">Jun</text><text x="320" y="248" fill="#64748b" font-size="11">Oct '26</text>
